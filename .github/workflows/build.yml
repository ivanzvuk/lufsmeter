name: Build LUFS Meter

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller numpy scipy PyQt5 pyaudio pythonnet sounddevice zeroconf

      - name: Build with PyInstaller
        shell: cmd
        run: |
          pyinstaller --name=LUFSMeter --windowed --onefile --icon=icon.ico --clean ^
            --add-binary="NAudio.dll;." ^
            --collect-all PyQt5 ^
            --collect-all scipy ^
            --collect-all sounddevice ^
            --hidden-import=scipy.signal --hidden-import=scipy.special --hidden-import=scipy.sparse ^
            --hidden-import=pyaudio --hidden-import=PyQt5 --hidden-import=clr --collect-all=clr ^
            --exclude-module=torch --exclude-module=transformers --exclude-module=tensorboard ^
            --exclude-module=pandas --exclude-module=matplotlib --exclude-module=PIL ^
            --exclude-module=torchvision --exclude-module=onnxruntime --exclude-module=sklearn ^
            --exclude-module=joblib --exclude-module=numba --exclude-module=rich ^
            lufsmeter.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUFSMeter-Windows
          path: dist/LUFSMeter.exe

  build-macos:
    runs-on: macos-latest  # GitHub теперь использует ARM (M1) runners
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          brew install portaudio ffmpeg || true

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller numpy scipy PyQt5 sounddevice zeroconf Pillow

      - name: Create icon (.icns)
        run: python create_icon_mac.py

      - name: Build .app bundle with PyInstaller
        run: |
          rm -rf build dist __pycache__ *.spec
          ARCH=$(uname -m)
          pyinstaller --windowed --onedir --clean \
            --name "LUFS Meter" \
            --icon icon.icns \
            --osx-bundle-identifier com.lufsmeter.app \
            --target-arch "$ARCH" \
            --collect-all PyQt5 \
            --collect-all scipy \
            --collect-all numpy \
            --collect-all sounddevice \
            --hidden-import scipy.signal \
            --hidden-import scipy.special \
            --hidden-import scipy.sparse \
            --hidden-import scipy.fft \
            --hidden-import scipy.linalg \
            --hidden-import scipy.optimize \
            --hidden-import scipy._lib \
            --hidden-import sounddevice \
            --hidden-import zeroconf \
            --exclude-module tkinter \
            --exclude-module matplotlib \
            --exclude-module PIL \
            --exclude-module pandas \
            --exclude-module cv2 \
            lufsmeter.py

      - name: Create DMG
        run: |
          hdiutil create -volname "LUFS Meter" \
            -srcfolder "dist/LUFS Meter.app" \
            -ov -format UDZO \
            "dist/LUFSMeter.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUFSMeter-macOS
          path: dist/LUFSMeter.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LUFSMeter-Windows/LUFSMeter.exe
            LUFSMeter-macOS/LUFSMeter.dmg
          generate_release_notes: true
