name: Build LUFS Meter

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller numpy scipy PyQt5 pyaudio pythonnet sounddevice zeroconf

      - name: Build with PyInstaller
        run: |
          pyinstaller --name=LUFSMeter --windowed --onefile --icon=icon.ico --clean `
            --add-binary="NAudio.dll;." `
            --hidden-import=scipy.signal --hidden-import=scipy.special --hidden-import=scipy.sparse `
            --hidden-import=pyaudio --hidden-import=PyQt5 --hidden-import=clr --collect-all=clr `
            --exclude-module=torch --exclude-module=transformers --exclude-module=tensorboard `
            --exclude-module=pandas --exclude-module=matplotlib --exclude-module=PIL `
            --exclude-module=torchvision --exclude-module=onnxruntime --exclude-modure=sklearn `
            --exclude-module=joblib --exclude-module=numba --exclude-module=rich `
            lufsmeter.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUFSMeter-Windows
          path: dist/LUFSMeter.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          brew install portaudio ffmpeg || true

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install numpy scipy PyQt5 sounddevice py2app zeroconf

      - name: Create icon
        run: python create_icon_mac.py

      - name: Build .app bundle
        run: python setup.py py2app

      - name: Create DMG
        run: |
          hdiutil create -volname "LUFS Meter" -srcfolder dist/LUFS\ Meter.app -ov -format UDZO dist/LUFSMeter.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUFSMeter-macOS
          path: dist/LUFSMeter.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LUFSMeter-Windows/LUFSMeter.exe
            LUFSMeter-macOS/LUFSMeter.dmg
          generate_release_notes: true
